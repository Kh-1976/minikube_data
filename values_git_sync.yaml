dags:
  gitSync:
    enabled: true
    repo: "https://github.com/Kh-1976/airflow-dags.git"
    branch: "main"
    rev: "HEAD"
    depth: 1
    period: "1m"
    subPath: ""
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  
  postgresUser: airflow
  postgresPassword: airflow
  postgresDatabase: airflow
  
  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 8Gi
  
  service:
    port: 5432
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m" 

airflow:
  # ✅ УДАЛЕН extraPipPackages - используем initContainers
  migrateDatabaseJob:
    enabled: true
  createUserJob:
    enabled: true
  
  # Общие volumes для всех компонентов
  extraVolumes:
    - name: pip-cache
      emptyDir:
        medium: Memory  # Кэш в памяти для скорости
        sizeLimit: 512Mi
  
  # Общие volumeMounts для всех компонентов
  extraVolumeMounts:
    - name: pip-cache
      mountPath: /pip-cache
  
  config:
    CORE__DAGS_FOLDER: '/opt/airflow/dags/repo'

  # Scheduler с initContainers
  scheduler:
    initContainers:
      - name: install-python-packages
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install --no-cache-dir --upgrade pip && \
            pip install --no-cache-dir confluent-kafka==2.5.0 faker==25.0.0 && \
            echo "✅ confluent-kafka и faker установлены" && \
            python -c "import confluent_kafka; print('✅ confluent_kafka импортируется')" || exit 1
        volumeMounts:
          - name: pip-cache
            mountPath: /pip-cache
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi

  # Webserver с initContainers  
  webserver:
    initContainers:
      - name: install-python-packages
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install --no-cache-dir --upgrade pip && \
            pip install --no-cache-dir confluent-kafka==2.5.0 faker==25.0.0 && \
            echo "✅ confluent-kafka и faker установлены" && \
            python -c "import confluent_kafka; print('✅ confluent_kafka импортируется')" || exit 1
        volumeMounts:
          - name: pip-cache
            mountPath: /pip-cache
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi

  # Workers с initContainers
  workers:
    initContainers:
      - name: install-python-packages
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install --no-cache-dir --upgrade pip && \
            pip install --no-cache-dir confluent-kafka==2.5.0 faker==25.0.0 && \
            echo "✅ confluent-kafka и faker установлены" && \
            python -c "import confluent_kafka; print('✅ confluent_kafka импортируется')" || exit 1
        volumeMounts:
          - name: pip-cache
            mountPath: /pip-cache
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
