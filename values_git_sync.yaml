dags:
  gitSync:
    enabled: true
    repo: "https://github.com/Kh-1976/airflow-dags.git"
    branch: "main"
    rev: "HEAD"
    depth: 1
    period: "1m"
    subPath: ""
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  
  postgresUser: airflow
  postgresPassword: airflow
  postgresDatabase: airflow
  
  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 8Gi
  
  service:
    port: 5432
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

airflow:
  migrateDatabaseJob:
    enabled: true
  createUserJob:
    enabled: true
  config:
    CORE__DAGS_FOLDER: '/opt/airflow/dags/repo'
  
  # Добавляем дополнительные контейнеры для установки пакетов
  extraContainers:
    - name: install-packages
      image: apache/airflow:3.1.7
      command: 
        - /bin/bash
        - -c
        - |
          pip install confluent-kafka && \
          pip install kafka-python && \
          echo "Packages installed successfully"
      volumeMounts:
        - name: airflow-home
          mountPath: /opt/airflow
  
  # Для worker пода тоже нужна установка
  workers:
    extraContainers:
      - name: install-packages
        image: apache/airflow:3.1.7
        command:
          - /bin/bash
          - -c
          - |
            pip install confluent-kafka && \
            pip install kafka-python && \
            echo "Packages installed successfully"
        volumeMounts:
          - name: airflow-home
            mountPath: /opt/airflow
