dags:
  gitSync:
    enabled: true
    repo: "https://github.com/Kh-1976/airflow-dags.git"
    branch: "main"
    rev: "HEAD"
    depth: 1
    period: "1m"
    subPath: ""
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  postgresUser: airflow
  postgresPassword: airflow
  postgresDatabase: airflow
  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 8Gi
  service:
    port: 5432
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

airflow:
  migrateDatabaseJob:
    enabled: true
  createUserJob:
    enabled: true

  # Явно указываем установку confluent-kafka при старте контейнеров
  extraPipPackages:
    - "confluent-kafka>=2.4.0"  # конкретная версия для стабильности
    - "faker>=18.0.0"            # если нужны фейковые данные в DAG-ах

  # Дополнительно: убедимся, что пакеты устанавливаются в нужное окружение
  web:
    extraVolumeMounts:
      - name: dags-volume
        mountPath: /opt/airflow/dags
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir $(echo $AIRFLOW__CORE__EXTRA_PIP_REQUIREMENTS | tr ',' ' ') && \
        airflow standalone

  scheduler:
    extraVolumeMounts:
      - name: dags-volume
        mountPath: /opt/airflow/dags
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir $(echo $AIRFLOW__CORE__EXTRA_PIP_REQUIREMENTS | tr ',' ' ') && \
        airflow scheduler

  config:
    CORE__DAGS_FOLDER: '/opt/airflow/dags/repo'
    CORE__LOAD_EXAMPLES: 'False'
    CORE__EXECUTOR: 'CeleryExecutor'  # если используете Celery
    # Дополнительно можно задать EXTRA_PIP_REQUIREMENTS (альтернативный способ)
    CORE__EXTRA_PIP_REQUIREMENTS: 'confluent-kafka,faker'

  # Опционально: добавить init-контейнер для установки зависимостей
  initContainers:
    - name: install-python-deps
      image: apache/airflow:3.0.2  # укажите актуальный образ
      command:
        - /bin/sh
        - -c
        - |
          pip install --no-cache-dir confluent-kafka faker
      volumeMounts:
        - name: dags-volume
          mountPath: /opt/airflow/dags

  volumes:
    - name: dags-volume
      emptyDir: {}
