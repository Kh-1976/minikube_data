dags:
  gitSync:
    enabled: true
    repo: "https://github.com/Kh-1976/airflow-dags.git"
    branch: "main"
    rev: "HEAD"
    depth: 1
    period: "1m"
    subPath: ""  # Синхронизирует корень репозитория (если даги в корне). Если по умолчанию /repo, это может помочь; иначе см. config ниже
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  
  postgresUser: airflow
  postgresPassword: airflow
  postgresDatabase: airflow
  
  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 8Gi
  
  service:
    port: 5432
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m" 
#Миграции и указание директории в ПОДах для DAGs, чтобы Airflow их увидел
airflow:
  migrateDatabaseJob:
    enabled: true
  createUserJob:
    enabled: true
  config:
    CORE__DAGS_FOLDER: '/opt/airflow/dags/repo'

scheduler:
  extraPipPackages:
    - "confluent-kafka==2.5.0"
worker:
  extraPipPackages:
    - "confluent-kafka==2.5.0"
dagProcessor:
  extraPipPackages:
    - "confluent-kafka==2.5.0"
