# kafka-kraft.yaml — исправленная версия 3 брокера
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kraft-controller
  labels:
    strimzi.io/cluster: my-kafka-cluster
spec:
  replicas: 3          # ← 3 контроллера для кворума KRaft
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kraft-broker
  labels:
    strimzi.io/cluster: my-kafka-cluster
spec:
  replicas: 3          # ← 3 брокера для отказоустойчивости
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-kafka-cluster
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    replicas: 3          # ← Должно совпадать с суммой ролей или быть удалено в KRaft
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3        # ← RF = числу брокеров
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2            # ← Минимум 2 для записи
      default.replication.factor: 3
      min.insync.replicas: 2                      # ← Гарантия записи на 2 брокера
  entityOperator:
    topicOperator: {}
    userOperator: {}
